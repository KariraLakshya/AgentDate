services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: dating, POSTGRES_PASSWORD: dating, POSTGRES_DB: dating}
    volumes: ["./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  worker:
    build: ./backend
    command: rq worker --url redis://redis:6379/0
    env_file: .env
    depends_on: [redis, postgres]
    volumes: ["./data:/app/data"]
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    depends_on: [backend]
    ports: ["3000:3000"]
