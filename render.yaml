# Render Blueprint: New > Blueprint > pick this repo. Creates the API and a Postgres database (free plans).
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: agentdate-api
    runtime: docker
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentdate-db
          property: connectionString
      - key: JOBS_MODE        # single instance: jobs and the SSE event bus share one process
        value: thread
      - key: SEED_ON_START    # loads the 25 synthetic personas + demo dates into the pool
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: IP_HASH_SALT
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-theta-orcin-19.vercel.app
      - key: LLM_MODE         # "mock" is free; switch to "groq" once the keys below are set
        value: mock
      - key: GROQ_API_KEY_STRONG
        sync: false
      - key: GROQ_API_KEY_FAST
        sync: false
      - key: GROQ_MODEL_STRONG
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: APIFY_TOKEN
        sync: false
      - key: LINKEDIN_ACTOR_ID
        value: harvestapi~linkedin-profile-scraper
      - key: INSTAGRAM_ACTOR_ID
        value: apify~instagram-profile-scraper

databases:
  - name: agentdate-db
    plan: free
    databaseName: dating
    user: dating
