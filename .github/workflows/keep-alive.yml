name: keep-alive

# Render's free web service sleeps after ~15 minutes without traffic. Ping /healthz every 10 minutes.
# Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://agentdate-api.onrender.com. Without it the job does nothing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set; skipping"; exit 0; fi
          # a cold start can take ~60s, so allow a long first attempt
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "${API_URL%/}/healthz"
